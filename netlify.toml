# Netlify build settings. Deployed by hand with `netlify deploy --build --prod`; no automatic builds on push.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Product photos never change once uploaded, so browsers may keep them for a year.
[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

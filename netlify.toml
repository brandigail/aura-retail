# Netlify build settings. Builds run on Netlify from GitHub pushes.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # The demo admin password is published on purpose in the README, so the secrets scan must skip it.
  SECRETS_SCAN_OMIT_PATHS = "README.md"

# Product photos never change once uploaded, so browsers may keep them for a year.
[[headers]]
  for = "/products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
